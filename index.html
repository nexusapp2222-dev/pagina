<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puente Llevari</title>
<style>
body{margin:0;font-family:sans-serif;background:#070514;color:#fff}
header{padding:12px 16px;background:#0F0A24;position:sticky;top:0}
.tabs{display:flex;gap:8px;margin-top:8px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#1E293B;color:#fff;font-weight:bold}
.tabs button.on{background:#7C3AED}
.card{margin:10px 12px;padding:12px;border-radius:14px;background:#1A103C;border:1px solid #334155}
.ok{color:#34D399}.bad{color:#EF4444}.mut{color:#A78BFA;font-size:12px}
#log{font-size:11px;color:#94A3B8;padding:10px 16px;white-space:pre-wrap}
</style></head><body>
<header><b>🌉 Puente Llevari</b> <span id="st">Conectando...</span>
<div class="tabs"><button id="b1" class="on" onclick="tab(1)">Cuentas</button><button id="b2" onclick="tab(2)">Pedidos</button><button id="b3" onclick="tab(3)">Registro</button></div></header>
<div id="v1"></div><div id="v2" style="display:none"></div><div id="v3" style="display:none"><div id="log"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const PIN="1234";
if(prompt("PIN")!==PIN){document.body.innerHTML="Acceso denegado";throw 0}
firebase.initializeApp({apiKey:"AIzaSyCFse23B_GRlRq_jBRy3I24Kg9Bhj5aHVs",authDomain:"llevari.firebaseapp.com",projectId:"llevari",appId:"1:219910137529:web:e5f693b239195dea9add68"});
const db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tab(n){[1,2,3].forEach(i=>{$("v"+i).style.display=i==n?"":"none";$("b"+i).className=i==n?"on":""})}
function log(t){$("log").textContent=new Date().toLocaleTimeString()+" "+t+"\n"+$("log").textContent.slice(0,3000)}
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2)+" "+pad(d.getHours())+":"+pad(d.getMinutes());
const rests={},pedidos={},ACT=["NUEVO","PENDIENTE","ACEPTADO","EN_CAMINO"];
const huerfanos=new Set();

db.collection("restaurantes").onSnapshot(s=>{
  s.forEach(d=>{const x=d.data();rests[d.id]={id:d.id,nombre:x.nombre,estado:x.estado,tipo_gestion:x.tipo_gestion}});pintar();
},e=>{$("st").textContent="❌ "+e.message;log("restaurantes: "+e.message)});

const prod={};
async function precios(rid){
  if(prod[rid]&&Date.now()-prod[rid].t<300000)return prod[rid].m;
  const s=await db.collection("restaurantes").doc(rid).collection("productos").get(),m={};
  s.forEach(d=>{const x=d.data();m[(x.nombre||"").toLowerCase()]={p:Number(x.precio)||0,o:x.opciones||""}});
  prod[rid]={t:Date.now(),m};return m;
}
function calcPrecio(np,m){
  if(!np)return 0;let q=1,n=np,ex="";
  const ix=n.indexOf("x ");if(ix>0&&ix<=3){q=parseInt(n.slice(0,ix))||1;n=n.slice(ix+2)}
  const p=n.indexOf("(");if(p>=0){ex=n.slice(p+1).replace(")","");n=n.slice(0,p)}
  const e=m[n.trim().toLowerCase()];if(!e)return 0;let u=e.p;
  if(e.o&&ex)e.o.split("/").forEach(c=>{if(!c.includes(":"))return;
    c.slice(c.indexOf(":")+1).split(",").forEach(it=>{const pt=it.split("+");
      if(pt.length>1&&ex.toLowerCase().includes(pt[0].trim().toLowerCase()))u+=parseFloat(pt[1])||0})});
  return u*q;
}

let cola=Promise.resolve();
function procesar(ref,d){
  const rid=ref.parent.parent.id;
  if(huerfanos.has(rid))return;
  cola=cola.then(()=>rellenar(ref,d)).catch(e=>log("❌ "+ref.path+": "+e.message))
}
async function rellenar(ref,d0){
  const resRef=ref.parent.parent,rid=resRef.id,e0=d0.estado||d0.status;
  if(huerfanos.has(rid))return;
  let precio=0;
  if(["EN_CAMINO","ENTREGADO","CANCELADO"].includes(e0)&&!d0.precio_platillo)precio=calcPrecio(d0.nombre_plato,await precios(rid));
  const hechos=await db.runTransaction(async tr=>{
    const ps=await tr.get(ref);if(!ps.exists)return null;
    const d=ps.data(),up={},e=d.estado||d.status;
    const rs=await tr.get(resRef);
    if(!rs.exists)return "HUERFANO";
    if(!d.restaurante_id)up.restaurante_id=rid;
    if(!d.id_numerico){
      const n=Math.max((rs.data()||{}).contador_pedidos||1000,1000)+1;
      tr.update(resRef,{contador_pedidos:n});up.id_numerico=n;
    }
    if(!d.creado_en){up.creado_en=FV.serverTimestamp();up.creado_en_aprox=true}
    if(!d.hora_creacion&&!d.fecha_creacion){
      const f=(d.creado_en&&d.creado_en.toDate)?d.creado_en.toDate():((d.timestamp&&d.timestamp.toDate)?d.timestamp.toDate():new Date());
      up.hora_creacion=fmt(f);
    }
    if(e==="ACEPTADO"&&!d.aceptado_en)up.aceptado_en=FV.serverTimestamp();
    if(["EN_CAMINO","ENTREGADO"].includes(e)&&!d.despachado_en)up.despachado_en=FV.serverTimestamp();
    if(e==="CANCELADO"&&!d.cancelado_en)up.cancelado_en=FV.serverTimestamp();
    if(["EN_CAMINO","ENTREGADO","CANCELADO"].includes(e)){
      if(!d.hora_despacho){up.hora_despacho=fmt(new Date());up.ts_despacho=Date.now()}
      if(!d.precio_platillo&&precio>0)up.precio_platillo=precio;
    }
    const k=Object.keys(up);if(!k.length)return null;
    tr.update(ref,up);return k;
  });
  if(hechos==="HUERFANO"){huerfanos.add(rid);log("⚠️ Restaurante '"+rid+"' no existe; se ignoran sus pedidos");return}
  if(hechos)log("Sellado "+rid+"/"+ref.id+": "+hechos.join(", "));
}

db.collectionGroup("pedidos").where("estado","in",["NUEVO","PENDIENTE","ACEPTADO","EN_CAMINO","ENTREGADO","CANCELADO"]).onSnapshot(s=>{
  $("st").textContent="🟢 en vivo";
  s.docChanges().forEach(c=>{
    const p=c.doc.ref.path;
    if(c.type==="removed"){delete pedidos[p];return}
    const d=c.doc.data();
    pedidos[p]={rid:c.doc.ref.parent.parent.id,estado:d.estado,num:d.id_numerico,plato:d.nombre_plato,hora:d.hora_creacion||""};
    if(!c.doc.metadata.hasPendingWrites)procesar(c.doc.ref,d);
  });
  pintar();
},e=>{$("st").textContent="❌ "+e.message;log(e.message)});

function pintar(){
  const cnt={};Object.values(pedidos).forEach(p=>{if(ACT.includes(p.estado))cnt[p.rid]=(cnt[p.rid]||0)+1});
  $("v1").innerHTML=Object.values(rests).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).map(r=>
    `<div class="card"><b>${esc(r.nombre||r.id)}</b><br><span class="${r.estado==="ABIERTO"?"ok":"bad"}">${esc(r.estado||"?")}</span> · ${r.tipo_gestion==="FISICO_REPARTIDOR"?"Autogestión":"En línea"}<br><span class="mut">Activos: ${cnt[r.id]||0}</span></div>`).join("");
  $("v2").innerHTML=Object.values(pedidos).sort((a,b)=>(b.num||0)-(a.num||0)).slice(0,100).map(p=>
    `<div class="card"><b>#${esc(p.num||"…")}</b> · ${esc((rests[p.rid]||{}).nombre||p.rid)}<br>${esc(p.plato)}<br><span class="mut">${esc(p.estado)} · ${esc(p.hora)}</span></div>`).join("");
}
async function wl(){try{await navigator.wakeLock.request("screen")}catch(e){}}
wl();document.addEventListener("visibilitychange",()=>{if(!document.hidden)wl()});
</script></body></html>
